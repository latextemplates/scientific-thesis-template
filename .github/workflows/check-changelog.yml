name: Check CHANGELOG

# Validate CHANGELOG.md against the Keep a Changelog conventions with heylogs.
# "--format github-actions" emits ::error:: annotations so problems show up
# inline on the pull request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  heylogs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check CHANGELOG.md with heylogs
        uses: jbangdev/jbang-action@03f9f9f6881262b315ec6b6c7d02d8af52ac889a # v0.142.0
        with:
          script: com.github.nbbrd.heylogs:heylogs-cli:0.18.1:bin
          scriptargs: check --format github-actions CHANGELOG.md
