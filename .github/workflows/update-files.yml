name: Update Files
on:
  push:
    branches:
      - switch-to-ltg
      - update-ltg
  workflow_dispatch:
concurrency:
  group: update-files
  cancel-in-progress: true
jobs:
  generatetex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ref: '${{ github.event.pull_request.head.ref }}'
          token: ${{ secrets.GH_TOKEN_WRITE }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'generator-latex-template/package-lock.json'
      - name: Make generator available globally
        working-directory: ${{ github.workspace }}/generator-latex-template
        run: |
          npm install
          npm link
          npm install -g yo
      - name: Generate all variants
        shell: bash
        run: |
          # All variants in one job and one commit; the variant that owns the shared files (README, Makefile, ...) comes last.
          for language in de en; do
            for listings in listings minted; do
              for variant in university-of-hamburg thu ustutt; do
                rm -rf /tmp/ltg && mkdir /tmp/ltg && cd /tmp/ltg
                yo $GITHUB_WORKSPACE/generator-latex-template/generators/app/index.js \
                 --githubpublish\
                 --overleaf=true\
                 --docker=iot\
                 --documentclass=scientific-thesis\
                 --thesisvariant=${variant}\
                 --papersize=a4\
                 --latexcompiler=both\
                 --bibtextool=biblatex\
                 --texlive=2026\
                 --lang=${language}\
                 --font=default\
                 --listings=${listings}\
                 --enquotes=csquotes\
                 --tweakouterquote=babel\
                 --todo=pdfcomment\
                 --examples=true\
                 --howtotext=true\
                 --uml=none

                ls -la

                if [ ${language} == "en" ]; then
                  LANGUAGE=english
                else
                  LANGUAGE=german
                fi

                if [ ${variant} == "ustutt" ]; then
                  VARIANT=""
                else
                  VARIANT="-${variant}"
                fi

                if [ ${listings} == "listings" ]; then
                  mv main-$LANGUAGE.tex main-basic-listings-$LANGUAGE$VARIANT.tex
                else
                  if [ -n "$VARIANT" ]; then
                    mv main-$LANGUAGE.tex main-$LANGUAGE$VARIANT.tex
                  fi
                fi

                # remove files which should not be overwritten

                # .latexmkrc alternates between including and excluding "--shell-escape"; we just want to keep the minted + en version of it
                if [ "${listings}" != "minted" ] || [ "${language}" != "en" ]; then
                  echo "REMOVING .latexmkrc"
                  rm Makefile
                  rm README.md
                  rm .latexmkrc
                  rm -rf .github/workflows
                  rm .dockerignore
                  rm .gitignore
                  rm abbreviations.tex
                  rm commands.tex
                fi

                # Files are ready
                # Overwrite old versions in $GITHUB_WORKSPACE
                cp -r * $GITHUB_WORKSPACE
                cp -r .* $GITHUB_WORKSPACE

              done
            done
          done
          cd ${{ github.workspace }}
          git status
          git diff
        env:
          yeoman_test: true
      - name: Commit changes
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          message: 'Update files based on generated files by template generator'
          author_name: 'github-actions[bot]'
          author_email: 'github-actions[bot]@users.noreply.github.com'
          push: false
      - name: Push changes
        run: |
          parallel --retries 10 --delay 9 ::: "git pull --rebase; git push"
  publish:
    runs-on: ubuntu-latest
    needs: [generatetex]
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: '${{ github.event.pull_request.head.ref }}'
      - name: Install TeX Live
        uses: zauguin/install-texlive@c9f3ea3d51b2e04d092c4f9d208a19542d5dabcf # v4.5.0
        with:
          package_file: '${{ github.workspace }}/Texlivefile'
      - name: Prepare latexmk
        run: |
          updmap -sys
          texhash
          tlmgr generate language --rebuild-sys
      - name: Build all examples
        run: |
          for doc in main*.tex; do
            latexmk "$doc"

            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## $doc" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            texlogsieve < "${doc%.tex}.log" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
      - run: |
          mkdir publish
          cp main*.pdf publish/
          cp README.md publish/
          cp .github/_config.yml publish/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish
          path: publish/
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          enable_jekyll: true
