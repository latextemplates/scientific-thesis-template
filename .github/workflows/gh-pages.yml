name: gh pages
on:
  push:
    branches:
      - main
      - add-gh-pages-workflow
  workflow_dispatch:
concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  publish:
    if: ${{ github.repository == 'latextemplates/scientific-thesis-template' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install TeX Live
        uses: zauguin/install-texlive@6671d0c62046c7e349fe154d5208fe746b07e037 # v4.4.0
        with:
          package_file: '${{ github.workspace }}/Texlivefile'
          texlive_version: 2026
      - name: Prepare latexmk
        run: |
          updmap -sys
          texhash
          tlmgr generate language --rebuild-sys
      - name: Build all examples
        run: |
          for doc in main*.tex; do
            latexmk "$doc"
          done
      - name: prepare publish
        run: |
          mkdir publish
          cp README.md publish/index.md
          cd publish
          cp -r ../docs/* .
          cp ../*.pdf .
      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: gh-pages
          build_dir: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
