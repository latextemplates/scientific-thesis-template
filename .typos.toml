# Spell checking with https://github.com/crate-ci/typos (CI job "typos")
# typos finds common misspellings, also in comments, which aspell and TeXtidote do not check.
# It knows English only, so German files are excluded.
[files]
extend-exclude = [
  # German
  "*german*",
  "*-de.tex",
  "*-de-*.tex",
  "*-de.md",
  "*.de.md",
  "chapters-de/",
  # Bibliography, styles, and classes
  "*.bib",
  "*.bst",
  "*.cls",
  "*.sty",
  # Word lists
  "*.pws",
  "generator-latex-template/",
]

[default]
extend-ignore-re = [
  # app-lication, app\-lication: examples of a hyphenation
  "app\\\\?-lication",
  # font encoding OT1
  "(?i)ot1",
  # German titles of books
  "Ein Leitfaden",
  # file name of a source
  "makros\\.tex",
]

[default.extend-words]
# German name of the algorithm float, mentioned in the CHANGELOG
Algorithmus = "Algorithmus"
# TeX Gyre Heros (font)
Heros = "Heros"
# microtype option "alltext-nott" (all text except typewriter fonts)
nott = "nott"
# label prefix for theorems (thm:...)
thm = "thm"
# 2\textsuperscript{nd}
nd = "nd"
