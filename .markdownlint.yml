default: true

# Allow arbitrary line length
#
# Reason: We apply the one-sentence-per-line rule. A sentence may get longer than 80 characters, especially if links are contained.
#
# Details: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md#md013---line-length
MD013: false

# Allow keyboard keys as inline HTML
#
# Details: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md#md033---no-inline-html
MD033:
  allowed_elements:
    - kbd

# Allow unused link reference definitions
#
# Reason: The README lists the links of all packages; each template uses only some of them.
#
# Details: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md#md053---link-and-image-reference-definitions-should-be-needed
MD053: false
